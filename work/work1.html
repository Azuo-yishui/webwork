<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配移动端视口 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片</title>
    <!-- 引入外部CSS样式文件 -->
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <!-- 名片容器 -->
    <div class="card">
        <!-- 头像区域 -->
        <div class="avatar">
            <!-- 可替换为自己头像图片地址 -->
            <img src="https://picsum.photos/120/120" alt="个人头像">
        </div>
        <!-- 姓名 -->
        <h2 class="name">张三</h2>
        <!-- 职位 -->
        <p class="position">前端开发工程师</p>
        <!-- 分割线 -->
        <div class="divider"></div>
        <!-- 联系方式区域 -->
        <div class="contact">
            <p>📞 电话：138‑0000‑0000</p>
            <p>📧 邮箱：example@email.com</p>
            <p>🌐 地址：四川·成都</p>
        </div>
    </div>
</body>
</html>
