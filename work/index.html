<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林墨 | 个人名片</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 页面主内容：个人名片卡片 -->
    <main class="page-shell">
        <article class="profile-card">
            <!-- 使用首字母制作无需额外图片资源的圆形头像 -->
            <div class="avatar" role="img" aria-label="林墨的头像">林</div>

            <!-- 个人基本信息 -->
            <header class="profile-header">
                <h1>小明</h1>
                <p class="job-title">品牌设计师</p>
            </header>

            <!-- 联系方式列表 -->
            <address class="contact-list">
                <a href="mailto:linmo@example.com" class="contact-item">
                    <span class="contact-icon" aria-hidden="true">✉</span>
                    <span>linmo@example.com</span>
                </a>
                <a href="tel:+8613800138000" class="contact-item">
                    <span class="contact-icon" aria-hidden="true">☎</span>
                    <span>+86 138 0013 8000</span>
                </a>
                <a href="https://www.linmo.design" class="contact-item" target="_blank" rel="noopener noreferrer">
                    <span class="contact-icon" aria-hidden="true">↗</span>
                    <span>www.linmo.design</span>
                </a>
            </address>
        </article>
    </main>
</body>
</html>
