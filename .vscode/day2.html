<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>列表</title>
</head>
<body>
    <!---无序列表  ul  ol -->
    <ul>专业
        <li>计算机科学与技术</li>
        <li>人工智能</li>
        <li>物联网技术</li>
        <li>大数据科学与技术</li>
    </ul>
   <!--列表符号：-->

   <!---有序列表  ol  li -->
    <ol type="A" start="3">班级
        <li>计算机科学与技术18班</li>
        <li>人工智能18班</li>
        <li>物联网技术18班</li>
        <li>大数据科学与技术18班</li>
    </ol>
    
    <!---定义列表  dl  dt  dd -->
    <dl>
        <dt>组长</dt>
        <dd>小红</dd>
        <dt>组员</dt>
        <dd>小芳</dd>
    </dl>

    <!---列表嵌套-->
    

    
</body>
</html>
