  <!DOCTYPE html>
 <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>表单的应用</title>
  </head>
  <body>
      <form action="a.html" method="post">
          <table cellspacing="0" cellpadding="5" align="center">
              <caption>青春不常在，抓紧谈恋爱</caption>
              <tr>
                  <td>姓名</td>
                  <td><input type="text" placeholder="请输入姓名"></td>
              </tr>
               <tr>
                  <td>性别</td>
                  <td><input type="radio" name="xb">男<input type="radio" name="xb">女
                  </td>
              </tr>
               <tr>
                  <td><span>出生日期</span></td>
                  <td><input type="date"></td>
              </tr>
              <tr>
                 <td><span>常住地</span></td>
                  <td>
                     <select name="" id="">
                        <option value="">四川</option>
                        <option value="">重庆</option>
                        <option value="">云南</option>
                        <option value="">贵州</option>
                        <option value="">海南</option>
                        <option value="">江西</option>
                        <option value="">陕西</option>
                        <option value="">山西</option>
                     </select>
                  </td>
              </tr>
               <tr>
                 <td><span>学历</span></td>
                  <td>
                     <select name="" id="">
                        <option value="">小学</option>
                        <option value="">初中</option>
                        <option value="">高中</option>
                        <option value="">大专</option>
                        <option value="">本科</option>
                        <option value="">硕士</option>
                        <option value="">博士</option>
                     </select>
                  </td>
              </tr>
              <tr>
                <td><span>手机号码</span></td>
                <td><input type="tel" placeholder="1[3,5,8,9][0-9]-[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{4}"></td>
              </tr>
                <tr>
                    <td><span>邮箱</span></td>
                    <td><input type="email"></td>
                </tr>
                 <tr>
                    <td><span>创建密码</span></td>
                    <td><input type="password" placeholder="请输入8-20个字母和数字的密码"></td>
                </tr>
                 <tr>
                    <td><span>兴趣爱好</span></td>
                    <td><input type="checkbox">唱歌<input type="checkbox">跳舞<input type="checkbox">运动<input type="checkbox">阅读</td>
                </tr>
                 <tr>
                    <td><span>喜欢的颜色</span></td>
                    <td><input type="color"></td>
                </tr>
                 <tr>
                    <td><span>幸运数字</span></td>
                    <td><input type="number" min="0" max="10"></td>
                </tr>
                 <tr>
                    <td><span>自我介绍</span></td>
                    <td><textarea name="" id="" cols="30" rows="5" placeholder="请输入自我介绍"></textarea></td>
                </tr>
                 <tr>
                    <td><span>个人照片</span></td>
                    <td><input type="file"></td>
                </tr>
                  <tr>
                    <td></td>
                    <td>
                        <button>注册</button>
                        <input type="button" value="注册">
                        <input type="submit">
                        <input type="reset" value="清空">
                    </td>
                </tr>


          </table>
      </form>
  </body>
</html>
