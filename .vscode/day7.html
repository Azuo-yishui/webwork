<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>留言板设计</title>
    <style>
        body{
            background:#e8f4fa;
            font-family:"Microsoft Yahei",sans-serif;
        }
        .container{
            width:900px;
            margin:20px auto;
        }
        .header{
            display:flex;
            justify-content:space-between;
        }
        .title-left{
            font-size:28px;
            color:#0044bb;
            font-weight:bold;
        }
        .title-right{
            color:#000;
            font-weight:bold;
        }
        .red-text{
            color:red;
            font-weight:bold;
        }
        table{
            width:100%;
            border-collapse:collapse;
        }
        table td{
            padding:8px;
        }
        textarea{
            width:320px;
            height:100px;
        }
        .note{
            font-size:14px;
            color:#0000aa;
            margin:10px 0;
        }
        .btn-group{
            text-align:center;
            margin:10px 0;
        }
        button{
            margin:0 8px;
        }
        .tip-list{
            font-size:14px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title-left">留言板</div>
        <div class="title-right">科技工作者建言</div>
    </div>

    <table>
        <tr>
            <td class="red-text">发表留言</td>
            <td></td>
        </tr>
        <tr>
            <td>姓&nbsp;&nbsp;&nbsp;&nbsp;名：</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>电子邮件:</td>
            <td><input type="text" style="width:350px"></td>
        </tr>
        <tr>
            <td>分&nbsp;&nbsp;&nbsp;&nbsp;类：</td>
            <td>
                <span class="red-text">科技工作者建言</span>
                <input type="radio" name="secret">不保密
                <input type="radio" name="secret">保密
                留言类型：
                <select>
                    <option></option>
                </select>
            </td>
        </tr>
        <tr>
            <td>留&nbsp;&nbsp;&nbsp;&nbsp;言:</td>
            <td><textarea></textarea></td>
        </tr>
    </table>

    <div class="note">注：如果您的留言不便公开，请选择"保密"选项，提交后可凭系统反馈给您的留言编号、查询密码和您的姓名查询回复。</div>

    <div class="btn-group">
        <button>提交</button>
        <button>清空</button>
    </div>

    <ul class="tip-list">
        <li>请遵守国家有关法律、法规，尊重网上道德，承担一切因您的行为而直接或间接引起的法律责任。</li>
        <li>本网站拥有管理笔名和留言的一切权利。</li>
    </ul>
</div>
</body>
</html>
